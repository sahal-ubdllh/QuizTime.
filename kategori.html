<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Kategori</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <!-- font awesome cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="header">
    <a href="home.html" class="logo"><span>Quiz</span>Time.</a>
    <div class="content">
        <nav class="navbar">
            <a href="home.html">Beranda</a>
            <a href="rule.html">Cara Bermain</a>
            <a href="about.html">Tentang Kami</a>
        </nav>
    </div>
    <div id="menu-btn" class="fas fa-bars"></div>
</header>
<main>
    <div class="container-kategori">
        <div class="back">
            <a href="home.html" class="back-button"><i class="fas fa-arrow-alt-circle-left"></i></a>
        </div>
        <h1>Pilih Kategori Kuis</h1>
        <div class="categories" id="categories-container">
            <!-- Kartu kategori dirender oleh JavaScript -->
        </div>
    </div>
</main>
</body>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/js/scripts.js"></script>
<script src="assets/js/data-categories.js"></script>
<script>
    const container = document.getElementById('categories-container');
    Object.entries(quizCategories).forEach(([key, label]) => {
        const link = document.createElement('a');
        link.href = 'level.html?kategori=' + encodeURIComponent(key);
        link.className = 'category-card';
        const h3 = document.createElement('h3');
        h3.textContent = label; // textContent -> aman dari XSS
        link.appendChild(h3);
        container.appendChild(link);
    });
</script>
</html>
